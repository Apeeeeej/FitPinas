$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.accessToken) pm.collectionVariables.set('token', json.accessToken);
    language: text/javascript
order: 2000
