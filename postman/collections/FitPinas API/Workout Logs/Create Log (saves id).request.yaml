$kind: http-request
url: "{{baseUrl}}/workout-logs"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "workoutDate": "2026-11-25",
      "durationMinutes": 30,
      "caloriesBurned": 200,
      "notes": "Morning workout"
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.id) pm.collectionVariables.set('logId', json.id);
    language: text/javascript
order: 3000
