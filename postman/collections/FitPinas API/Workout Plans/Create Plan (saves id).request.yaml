$kind: http-request
url: "{{baseUrl}}/workout-plans"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Beginner Fitness Plan",
      "description": "Basic workout routine",
      "goal": "Strength",
      "durationWeeks": 4
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.id) pm.collectionVariables.set('planId', json.id);
    language: text/javascript
order: 3000
